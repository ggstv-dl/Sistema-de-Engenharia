services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-engineer-civil-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm_engineer_civil
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_dev_password_change_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - crm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_engineer_civil"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  crm_postgres_data:
